[package]
name = "ordo-device-peer"
version = "0.1.0"
edition = "2021"
description = "Reusable Ordo peer presence and control helpers for device apps."
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
ordo-protocol = { path = "../Ordo+webview+avatar/ordo-protocol" }
ordo-transport = { path = "../Ordo+webview+avatar/ordo-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
